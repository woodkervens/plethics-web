<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">

        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700&display=swap">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=timenewroman:wght@100;300;400;500;700&display=swap">

    </head>
    
    <body>
        <!--Bloc1- NAVBAR-->
        <header class="main-header">
    <nav class="nav-bar">
        <!-- Groupe de gauche -->
        <div class="nav-left">
            <!-- Bouton Menu Hamburger -->
            <button class="nav-icon-btn hamburger-btn" aria-label="Menu">
                <i class="fa-solid fa-bars"></i>
            </button>
            <!-- Logo du site -->
            <a href="/index.html" class="logo">
                <img src="logo/logo.png.png" alt="Plethics Logo">
            </a>
            
            <!-- Liens de navigation textuels -->
            <ul class="nav-links">
                <li><a href="#" class="active">HOME</a></li>
                <li><a href="#">PRODUCTS</a></li>
                <li><a href="#">ABOUT</a></li>
            </ul>
        </div>

          <!-- Groupe de droite -->
        <div class="nav-right">
             <div class="nav-search">
        <i class="fa-solid fa-magnifying-glass nav-search-icon" aria-hidden="true"></i>
        <input type="search" placeholder="Search....." aria-label="Rechercher un produit">
      </div>
            <!-- 1. Bouton Favoris (Cœur) -->
            <button class="nav-icon-btn" aria-label="Favoris">
                <i class="fa-regular fa-heart"></i>
            </button>
            
            <!-- 2. Bouton Panier (Sac de shopping) -->
            <button class="nav-icon-btn" aria-label="Panier">
                <i class="fa-solid fa-bag-shopping"></i>
            </button>
            <!-- 3. Bouton Utilisateur (Compte) -->
            <button class="nav-icon-btn" aria-label="Mon compte">
                <i class="fa-regular fa-user"></i>
            </button>
        </div>
    </nav>
        </header>  

        <!--Bloc2- HERO-->
